name: Apply five workflow blocks

on:
  push:
    branches:
      - ui/five-workflow-blocks
    paths:
      - ".github/workflows/apply-five-workflow-blocks.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ui/five-workflow-blocks
          fetch-depth: 0

      - name: Build five-block workflow UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('prototype/index.html')
          html = index.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global html
              if old not in html:
                  raise SystemExit(f'{label} not found')
              html = html.replace(old, new, 1)

          replace_once(
              '        <section class="card">\n            <h2>1. Fahrzeugzuordnung</h2>',
              '        <section class="card workflow-block workflow-block-1">\n            <div class="workflow-block-heading">\n                <span class="workflow-step-number">1</span>\n                <div>\n                    <p class="eyebrow">Schritt 1 von 5</p>\n                    <h2>Fahrzeugzuordnung</h2>\n                </div>\n            </div>',
              'block 1 header'
          )

          replace_once(
              '            </div>\n        </section>\n\n        <section class="card master-data-card">\n            <details id="masterDataDetails" class="master-data-details">',
              '            </div>\n\n            <div class="workflow-subsection">\n                <details id="masterDataDetails" class="master-data-details">',
              'master data start'
          )

          replace_once(
              '            </details>\n        </section>\n\n        <section class="card">\n            <h2>2. Teileinformationen</h2>',
              '                </details>\n            </div>\n        </section>\n\n        <section class="card workflow-block workflow-block-2">\n            <div class="workflow-block-heading">\n                <span class="workflow-step-number">2</span>\n                <div>\n                    <p class="eyebrow">Schritt 2 von 5</p>\n                    <h2>Teileinformationen</h2>\n                </div>\n            </div>',
              'block 2 header'
          )

          replace_once(
              '        <section class="actions">',
              '        <section class="card workflow-block workflow-block-3">\n            <div class="workflow-block-heading">\n                <span class="workflow-step-number">3</span>\n                <div>\n                    <p class="eyebrow">Schritt 3 von 5</p>\n                    <h2>Prüfen &amp; Speichern</h2>\n                </div>\n            </div>\n\n            <section class="actions workflow-actions">',
              'block 3 start'
          )

          replace_once(
              '        <section id="resultCard" class="card result-card hidden" aria-live="polite">',
              '            <section id="resultCard" class="result-card workflow-result hidden" aria-live="polite">',
              'result card'
          )

          replace_once(
              '        </section>\n\n        <section class="card ats-transfer-card">',
              '            </section>\n        </section>\n\n        <section class="card workflow-block workflow-block-4 ats-transfer-card">',
              'close block 3 and open 4'
          )

          replace_once(
              '            <div class="section-heading">\n                <div>\n                    <p class="eyebrow">Zeitsparender Logistik-Workflow</p>\n                    <h2>ATS-Schnellübernahme</h2>\n                </div>\n            </div>',
              '            <div class="workflow-block-heading">\n                <span class="workflow-step-number">4</span>\n                <div>\n                    <p class="eyebrow">Schritt 4 von 5 · Zeitsparender Logistik-Workflow</p>\n                    <h2>ATS-Schnellübernahme</h2>\n                </div>\n            </div>',
              'block 4 header'
          )

          replace_once(
              '        <section class="card">\n            <div class="section-heading tracking-heading">\n                <div>\n                    <p class="eyebrow">Tracking-Historie</p>\n                    <h2>Teile und Steuergeräte</h2>\n                </div>\n                <span id="savedCount" class="counter">0</span>\n            </div>',
              '        <section class="card workflow-block workflow-block-5">\n            <div class="workflow-block-heading tracking-heading">\n                <span class="workflow-step-number">5</span>\n                <div class="workflow-heading-main">\n                    <p class="eyebrow">Schritt 5 von 5 · Tracking-Historie</p>\n                    <h2>Teile und Steuergeräte</h2>\n                </div>\n                <span id="savedCount" class="counter">0</span>\n            </div>',
              'block 5 header'
          )

          index.write_text(html, encoding='utf-8')

          styles = Path('prototype/styles.css')
          css = styles.read_text(encoding='utf-8')
          marker = '/* Five workflow blocks */'
          if marker not in css:
              rules = [
                  '',
                  marker,
                  '.workflow-block { position: relative; margin-bottom: 20px; padding: 20px; border: 1px solid #d9e2ec; border-left: 6px solid #315f86; border-radius: 16px; box-shadow: 0 5px 18px rgba(32, 52, 72, 0.07); }',
                  '.workflow-block:not(.workflow-block-5)::after { content: ""; position: absolute; left: 44px; bottom: -21px; width: 3px; height: 20px; border-radius: 999px; background: #c5d3df; }',
                  '.workflow-block-heading { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; padding-bottom: 13px; border-bottom: 1px solid #e6edf3; }',
                  '.workflow-block-heading h2 { margin: 0; }',
                  '.workflow-block-heading .eyebrow { margin: 0 0 2px; }',
                  '.workflow-step-number { display: grid; flex: 0 0 52px; width: 52px; height: 52px; place-items: center; border-radius: 14px; background: #315f86; color: #fff; font-size: 1.35rem; font-weight: 800; line-height: 1; box-shadow: 0 4px 12px rgba(49, 95, 134, 0.18); }',
                  '.workflow-heading-main { min-width: 0; flex: 1 1 auto; }',
                  '.workflow-block-5 .counter { margin-left: auto; }',
                  '.workflow-subsection { margin-top: 16px; padding-top: 14px; border-top: 1px dashed #d7e1ea; }',
                  '.workflow-subsection .master-data-details { margin: 0; }',
                  '.workflow-actions { margin: 0; padding: 0; }',
                  '.workflow-result { margin-top: 16px; padding: 16px; border: 1px solid #e1e8ee; border-radius: 12px; background: #f8fafc; }',
                  '.workflow-block-4 { border-left-color: #6b5a2f; }',
                  '.workflow-block-4 .workflow-step-number { background: #6b5a2f; }',
                  '.workflow-block-5 { border-left-color: #3f6d55; }',
                  '.workflow-block-5 .workflow-step-number { background: #3f6d55; }',
                  '@media (max-width: 720px) {',
                  '    .workflow-block { margin-bottom: 16px; padding: 14px; border-left-width: 4px; border-radius: 12px; }',
                  '    .workflow-block:not(.workflow-block-5)::after { left: 31px; bottom: -17px; height: 16px; }',
                  '    .workflow-block-heading { gap: 10px; margin-bottom: 14px; padding-bottom: 10px; }',
                  '    .workflow-step-number { flex-basis: 42px; width: 42px; height: 42px; border-radius: 11px; font-size: 1.1rem; }',
                  '    .workflow-block-heading h2 { font-size: 1.08rem; }',
                  '    .workflow-block-5 .counter { align-self: flex-start; }',
                  '}',
                  ''
              ]
              css += '\n'.join(rules)
          styles.write_text(css, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('prototype/index.html').read_text(encoding='utf-8')
          assert html.count('workflow-block workflow-block-') == 5, 'Five workflow blocks expected'
          assert html.count('workflow-step-number') == 5, 'Five step numbers expected'
          ids = re.findall(r'id="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          assert not duplicates, f'Duplicate HTML ids: {duplicates}'
          assert html.count('<details') == html.count('</details>'), 'Unbalanced details tags'
          assert html.count('<section') == html.count('</section>'), 'Unbalanced section tags'
          css = Path('prototype/styles.css').read_text(encoding='utf-8')
          assert '/* Five workflow blocks */' in css
          print('Five-block UI validation: OK')
          PY
          node --check prototype/app.js
          node --check prototype/scanner-service.js

      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-five-workflow-blocks.yml
          git config user.name "Teiletracking Automation"
          git config user.email "actions@users.noreply.github.com"
          git add prototype/index.html prototype/styles.css .github/workflows/apply-five-workflow-blocks.yml
          git commit -m "Restructure UI into five workflow blocks"
          git push origin ui/five-workflow-blocks
