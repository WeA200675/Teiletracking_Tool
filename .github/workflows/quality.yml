name: Quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in prototype/*.js tests/*.js; do
            node --check "$file"
          done
      - name: Run OCR privacy tests
        run: node tests/Test-OcrPrivacy.js
      - name: Run frontend supply-chain guard
        run: node tests/Test-FrontendSupplyChain.js
      - name: Run database backup encryption tests
        run: node tests/Test-DatabaseBackup.js

  powershell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run PowerShell tests
        shell: pwsh
        run: ./tests/Run-AllTests.ps1
