name: Apply collapsible master data and quick properties

on:
  push:
    branches:
      - ui/collapsible-master-data-custom-properties
    paths:
      - ".github/workflows/apply-collapsible-master-data.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ui/collapsible-master-data-custom-properties
          fetch-depth: 0

      - name: Apply UI changes
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/apply-ui.py
          python /tmp/apply-ui.py

      - name: Validate files
        shell: bash
        run: |
          node --check prototype/app.js
          python - <<'PY'
          from pathlib import Path
          html = Path('prototype/index.html').read_text(encoding='utf-8')
          css = Path('prototype/styles.css').read_text(encoding='utf-8')
          assert 'id="masterDataDetails"' in html
          assert 'id="openCustomStatusButton"' in html
          assert 'id="statusMasterPanel"' in html
          assert 'Collapsible master data + quick custom properties' in css
          print('Validation OK')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-collapsible-master-data.yml
          git config user.name "Teiletracking Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add collapsible master data and quick custom properties"
          git push origin HEAD:ui/collapsible-master-data-custom-properties
