name: Apply ZXing WASM scanner

on:
  push:
    branches:
      - scanner/zxing-wasm-compact-v2
    paths:
      - ".github/workflows/apply-zxing-wasm-scanner.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: scanner/zxing-wasm-compact-v2
          fetch-depth: 0

      - name: Replace scanner engine and compact UI
        shell: bash
        run: |
          cat > prototype/scanner-service.js <<'EOF'
          "use strict";

          (function initializeScannerService(global) {
              let stream = null;
              let activeTrack = null;
              let detector = null;
              let engineMode = "UNINITIALIZED";
              let lastDiagnostics = null;
              let liveTimer = null;
              let liveBusy = false;
              let lastLiveQrText = "";
              let lastLiveQrAt = null;
              let liveCallback = null;

              const LIVE_SCAN_INTERVAL_MS = 420;
              const LIVE_SCAN_MAX_WIDTH = 960;

              function delay(milliseconds) {
                  return new Promise(resolve => global.setTimeout(resolve, milliseconds));
              }

              function getErrorMessage(error) {
                  if (!error) {
                      return "Die Kamera konnte nicht gestartet werden.";
                  }

                  switch (error.name) {
                      case "NotAllowedError":
                      case "PermissionDeniedError":
                          return "Der Kamerazugriff wurde nicht erlaubt. Bitte erlaube den Kamerazugriff im Browser.";
                      case "NotFoundError":
                      case "DevicesNotFoundError":
                          return "Es wurde keine verwendbare Kamera gefunden.";
                      case "NotReadableError":
                      case "TrackStartError":
                          return "Die Kamera ist bereits belegt oder konnte nicht gelesen werden.";
                      case "OverconstrainedError":
                      case "ConstraintNotSatisfiedError":
                          return "Die gewünschte Kameraeinstellung wird von diesem Gerät nicht unterstützt.";
                      case "SecurityError":
                          return "Der Browser blockiert den Kamerazugriff aus Sicherheitsgründen.";
                      default:
                          return error.message
                              ? `Kamera-Fehler: ${error.message}`
                              : "Die Kamera konnte nicht gestartet werden.";
                  }
              }

              function assertCameraEnvironment() {
                  if (
                      !global.isSecureContext &&
                      global.location.hostname !== "localhost" &&
                      global.location.hostname !== "127.0.0.1"
                  ) {
                      throw new Error("Der Kamerazugriff benötigt HTTPS oder localhost.");
                  }

                  if (!global.navigator.mediaDevices || !global.navigator.mediaDevices.getUserMedia) {
                      throw new Error("Dieser Browser stellt keinen Kamerazugriff über getUserMedia bereit.");
                  }
              }

              async function initializeQrEngine() {
                  detector = null;
                  engineMode = "UNAVAILABLE";

                  if (
                      global.ZXingWASM &&
                      typeof global.ZXingWASM.readBarcodes === "function"
                  ) {
                      engineMode = "ZXING_WASM";

                      if (typeof global.ZXingWASM.prepareZXingModule === "function") {
                          try {
                              await global.ZXingWASM.prepareZXingModule({
                                  fireImmediately: true
                              });
                          }
                          catch (error) {
                              console.warn("ZXing-WASM konnte nicht vorab geladen werden. Der erste Scan versucht es erneut.", error);
                          }
                      }

                      return engineMode;
                  }

                  if ("BarcodeDetector" in global) {
                      try {
                          let supportsQr = true;
                          if (typeof global.BarcodeDetector.getSupportedFormats === "function") {
                              const formats = await global.BarcodeDetector.getSupportedFormats();
                              supportsQr = formats.includes("qr_code");
                          }

                          if (supportsQr) {
                              detector = new global.BarcodeDetector({ formats: ["qr_code"] });
                              engineMode = "BARCODE_DETECTOR";
                              return engineMode;
                          }
                      }
                      catch (error) {
                          console.warn("Native BarcodeDetector-Erkennung ist nicht verfügbar.", error);
                      }
                  }

                  if (typeof global.jsQR === "function") {
                      engineMode = "JSQR";
                      return engineMode;
                  }

                  throw new Error(
                      "Keine QR-Engine verfügbar. ZXing-WASM, BarcodeDetector und jsQR konnten nicht geladen werden."
                  );
              }

              async function applyBestCameraConstraints(track) {
                  if (!track) return;

                  try {
                      const capabilities = typeof track.getCapabilities === "function"
                          ? track.getCapabilities()
                          : {};
                      const advanced = {};

                      if (Array.isArray(capabilities.focusMode) && capabilities.focusMode.includes("continuous")) {
                          advanced.focusMode = "continuous";
                      }

                      if (capabilities.zoom && Number.isFinite(Number(capabilities.zoom.min))) {
                          const min = Number(capabilities.zoom.min);
                          const max = Number(capabilities.zoom.max);
                          const preferred = Math.min(max, Math.max(min, min + (max - min) * 0.08));
                          if (Number.isFinite(preferred)) advanced.zoom = preferred;
                      }

                      if (Object.keys(advanced).length > 0) {
                          await track.applyConstraints({ advanced: [advanced] });
                      }
                  }
                  catch (error) {
                      console.warn("Optimierte Kameraeinstellungen konnten nicht angewendet werden.", error);
                  }
              }

              async function waitForVideoReady(videoElement) {
                  if (videoElement.videoWidth && videoElement.videoHeight) {
                      await delay(250);
                      return;
                  }

                  await new Promise((resolve, reject) => {
                      const timeoutId = global.setTimeout(
                          () => reject(new Error("Die Kamera liefert noch kein stabiles Bild.")),
                          5000
                      );

                      videoElement.addEventListener("loadedmetadata", () => {
                          global.clearTimeout(timeoutId);
                          resolve();
                      }, { once: true });
                  });

                  await delay(250);
              }

              function calculateImageQuality(canvas, context) {
                  const targetWidth = Math.min(canvas.width, 900);
                  const scale = targetWidth / canvas.width;
                  const targetHeight = Math.max(1, Math.round(canvas.height * scale));
                  const sample = document.createElement("canvas");
                  sample.width = targetWidth;
                  sample.height = targetHeight;
                  const sampleContext = sample.getContext("2d", { willReadFrequently: true });
                  sampleContext.drawImage(canvas, 0, 0, targetWidth, targetHeight);

                  const imageData = sampleContext.getImageData(0, 0, targetWidth, targetHeight);
                  const data = imageData.data;
                  let brightnessSum = 0;
                  let glare = 0;
                  let dark = 0;
                  let gradient = 0;
                  let samples = 0;

                  const luminanceAt = index =>
                      data[index] * 0.299 + data[index + 1] * 0.587 + data[index + 2] * 0.114;

                  for (let y = 1; y < targetHeight - 1; y += 2) {
                      for (let x = 1; x < targetWidth - 1; x += 2) {
                          const index = (y * targetWidth + x) * 4;
                          const rightIndex = (y * targetWidth + x + 1) * 4;
                          const downIndex = ((y + 1) * targetWidth + x) * 4;
                          const value = luminanceAt(index);
                          brightnessSum += value;
                          glare += value >= 247 ? 1 : 0;
                          dark += value <= 28 ? 1 : 0;
                          gradient += Math.abs(value - luminanceAt(rightIndex)) + Math.abs(value - luminanceAt(downIndex));
                          samples += 1;
                      }
                  }

                  const brightness = samples ? brightnessSum / samples : 0;
                  const edgeScore = samples ? gradient / samples : 0;
                  const glareRatio = samples ? glare / samples : 0;
                  const darkRatio = samples ? dark / samples : 0;
                  const warnings = [];

                  if (brightness < 58) warnings.push("zu dunkel");
                  if (brightness > 225) warnings.push("zu hell");
                  if (glareRatio > 0.18) warnings.push("starke Reflexionen");
                  if (darkRatio > 0.42) warnings.push("große dunkle Flächen");
                  if (edgeScore < 10) warnings.push("möglicherweise unscharf");

                  return {
                      brightness: Math.round(brightness),
                      edgeScore: Math.round(edgeScore * 10) / 10,
                      glarePercent: Math.round(glareRatio * 100),
                      darkPercent: Math.round(darkRatio * 100),
                      warnings,
                      good: warnings.length === 0
                  };
              }

              function canvasFromVideo(videoElement, maxWidth = 0) {
                  if (
                      videoElement.readyState < global.HTMLMediaElement.HAVE_CURRENT_DATA ||
                      !videoElement.videoWidth ||
                      !videoElement.videoHeight
                  ) {
                      throw new Error("Das Kamerabild ist noch nicht bereit. Bitte kurz warten und erneut auslösen.");
                  }

                  const scale = maxWidth > 0 && videoElement.videoWidth > maxWidth
                      ? maxWidth / videoElement.videoWidth
                      : 1;
                  const canvas = document.createElement("canvas");
                  canvas.width = Math.max(1, Math.round(videoElement.videoWidth * scale));
                  canvas.height = Math.max(1, Math.round(videoElement.videoHeight * scale));
                  const context = canvas.getContext("2d", { willReadFrequently: true });
                  context.imageSmoothingEnabled = true;
                  context.imageSmoothingQuality = "high";
                  context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                  return { canvas, context };
              }

              async function canvasFromBlob(blob) {
                  const bitmap = await global.createImageBitmap(blob);
                  try {
                      const canvas = document.createElement("canvas");
                      canvas.width = bitmap.width;
                      canvas.height = bitmap.height;
                      const context = canvas.getContext("2d", { willReadFrequently: true });
                      context.drawImage(bitmap, 0, 0);
                      return { canvas, context };
                  }
                  finally {
                      if (typeof bitmap.close === "function") bitmap.close();
                  }
              }

              async function captureBestStill(videoElement) {
                  let captureSource = "Videoframe";
                  let capture;

                  if (activeTrack && "ImageCapture" in global) {
                      try {
                          const imageCapture = new global.ImageCapture(activeTrack);
                          if (typeof imageCapture.takePhoto === "function") {
                              const blob = await imageCapture.takePhoto();
                              capture = await canvasFromBlob(blob);
                              captureSource = "Kamera-Foto";
                          }
                      }
                      catch (error) {
                          console.warn("Hochauflösendes Kamera-Foto nicht verfügbar, Videoframe wird verwendet.", error);
                      }
                  }

                  if (!capture) capture = canvasFromVideo(videoElement);

                  const quality = calculateImageQuality(capture.canvas, capture.context);
                  const dataUrl = capture.canvas.toDataURL("image/jpeg", 0.94);

                  lastDiagnostics = {
                      resolution: `${capture.canvas.width}×${capture.canvas.height}`,
                      captureSource,
                      quality,
                      qrAttempts: [],
                      qrEngine: engineMode,
                      qrFoundBy: "",
                      liveQrText: lastLiveQrText,
                      liveQrAt: lastLiveQrAt
                  };

                  return { ...capture, quality, dataUrl, captureSource };
              }

              function captureFrame(videoElement) {
                  const capture = canvasFromVideo(videoElement);
                  const quality = calculateImageQuality(capture.canvas, capture.context);
                  lastDiagnostics = {
                      resolution: `${capture.canvas.width}×${capture.canvas.height}`,
                      captureSource: "Videoframe",
                      quality,
                      qrAttempts: [],
                      qrEngine: engineMode,
                      qrFoundBy: "",
                      liveQrText: lastLiveQrText,
                      liveQrAt: lastLiveQrAt
                  };
                  return {
                      ...capture,
                      quality,
                      dataUrl: capture.canvas.toDataURL("image/jpeg", 0.94),
                      captureSource: "Videoframe"
                  };
              }

              function cloneRegionCanvas(sourceCanvas, x, y, width, height, targetWidth = 0) {
                  const scale = targetWidth > 0 && width > targetWidth ? targetWidth / width : 1;
                  const canvas = document.createElement("canvas");
                  canvas.width = Math.max(1, Math.round(width * scale));
                  canvas.height = Math.max(1, Math.round(height * scale));
                  const context = canvas.getContext("2d", { willReadFrequently: true });
                  context.drawImage(sourceCanvas, x, y, width, height, 0, 0, canvas.width, canvas.height);
                  return { canvas, context };
              }

              async function decodeWithZxing(canvas, label) {
                  if (!global.ZXingWASM || typeof global.ZXingWASM.readBarcodes !== "function") return "";
                  if (lastDiagnostics) lastDiagnostics.qrAttempts.push(label);
                  const context = canvas.getContext("2d", { willReadFrequently: true });
                  const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                  const results = await global.ZXingWASM.readBarcodes(imageData, {
                      formats: ["QRCode"],
                      tryHarder: true,
                      tryRotate: true,
                      tryInvert: true,
                      tryDownscale: true,
                      tryDenoise: true,
                      maxNumberOfSymbols: 1
                  });
                  const result = Array.isArray(results)
                      ? results.find(item => item && item.isValid !== false && String(item.text || "").trim())
                      : null;
                  if (!result) return "";
                  const text = String(result.text || "").trim();
                  if (text && lastDiagnostics) lastDiagnostics.qrFoundBy = label;
                  return text;
              }

              async function decodeWithBarcodeDetector(canvas, label) {
                  if (!detector) return "";
                  if (lastDiagnostics) lastDiagnostics.qrAttempts.push(label);
                  try {
                      const barcodes = await detector.detect(canvas);
                      const raw = barcodes && barcodes[0] ? String(barcodes[0].rawValue || "").trim() : "";
                      if (raw && lastDiagnostics) lastDiagnostics.qrFoundBy = label;
                      return raw;
                  }
                  catch {
                      return "";
                  }
              }

              function decodeWithJsQr(canvas, label) {
                  if (typeof global.jsQR !== "function") return "";
                  if (lastDiagnostics) lastDiagnostics.qrAttempts.push(label);
                  const context = canvas.getContext("2d", { willReadFrequently: true });
                  const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                  const result = global.jsQR(imageData.data, canvas.width, canvas.height, {
                      inversionAttempts: "attemptBoth"
                  });
                  const text = result && result.data ? String(result.data).trim() : "";
                  if (text && lastDiagnostics) lastDiagnostics.qrFoundBy = label;
                  return text;
              }

              async function decodeSingleCanvas(canvas, label) {
                  let value = "";
                  if (engineMode === "ZXING_WASM") {
                      try {
                          value = await decodeWithZxing(canvas, `ZXing ${label}`);
                      }
                      catch (error) {
                          console.warn("ZXing-WASM Scan fehlgeschlagen; Fallback wird versucht.", error);
                      }
                  }
                  if (!value && detector) value = await decodeWithBarcodeDetector(canvas, `BarcodeDetector ${label}`);
                  if (!value) value = decodeWithJsQr(canvas, `jsQR ${label}`);
                  return value;
              }

              async function detectQr(canvas, context) {
                  if (!lastDiagnostics) {
                      lastDiagnostics = {
                          resolution: `${canvas.width}×${canvas.height}`,
                          captureSource: "Bild",
                          quality: calculateImageQuality(canvas, context),
                          qrAttempts: [],
                          qrEngine: engineMode,
                          qrFoundBy: "",
                          liveQrText: lastLiveQrText,
                          liveQrAt: lastLiveQrAt
                      };
                  }

                  if (lastLiveQrText) {
                      lastDiagnostics.qrAttempts.push("Live-Scan Treffer");
                      lastDiagnostics.qrFoundBy = "ZXing Live-Scan";
                      return lastLiveQrText;
                  }

                  let value = await decodeSingleCanvas(canvas, "Vollbild");
                  if (value) return value;

                  const width = canvas.width;
                  const height = canvas.height;
                  const regions = [
                      ["Zentrum 85%", 0.075, 0.075, 0.85, 0.85],
                      ["Mitte links", 0.0, 0.12, 0.68, 0.76],
                      ["Mitte rechts", 0.32, 0.12, 0.68, 0.76],
                      ["Oben", 0.08, 0.0, 0.84, 0.68],
                      ["Unten", 0.08, 0.32, 0.84, 0.68]
                  ];

                  for (const [label, rx, ry, rw, rh] of regions) {
                      const region = cloneRegionCanvas(
                          canvas,
                          Math.round(width * rx),
                          Math.round(height * ry),
                          Math.round(width * rw),
                          Math.round(height * rh),
                          1800
                      );
                      value = await decodeSingleCanvas(region.canvas, label);
                      if (value) return value;
                  }
                  return "";
              }

              async function scanLiveFrame(videoElement) {
                  if (liveBusy || !stream || !videoElement.videoWidth) return;
                  liveBusy = true;
                  try {
                      const { canvas } = canvasFromVideo(videoElement, LIVE_SCAN_MAX_WIDTH);
                      const text = await decodeSingleCanvas(canvas, "Live");
                      if (text && text !== lastLiveQrText) {
                          lastLiveQrText = text;
                          lastLiveQrAt = new Date().toISOString();
                          if (typeof liveCallback === "function") {
                              liveCallback(text, { engine: engineMode, foundAt: lastLiveQrAt });
                          }
                      }
                  }
                  catch (error) {
                      console.debug("Live-QR-Scan ohne Treffer:", error);
                  }
                  finally {
                      liveBusy = false;
                  }
              }

              function startLiveLoop(videoElement) {
                  stopLiveLoop();
                  liveTimer = global.setInterval(() => scanLiveFrame(videoElement), LIVE_SCAN_INTERVAL_MS);
              }

              function stopLiveLoop() {
                  if (liveTimer) {
                      global.clearInterval(liveTimer);
                      liveTimer = null;
                  }
                  liveBusy = false;
              }

              async function startCamera(videoElement, options = {}) {
                  stopCamera(videoElement);
                  assertCameraEnvironment();
                  await initializeQrEngine();

                  lastLiveQrText = "";
                  lastLiveQrAt = null;
                  liveCallback = typeof options.onQrDetected === "function" ? options.onQrDetected : null;

                  stream = await global.navigator.mediaDevices.getUserMedia({
                      audio: false,
                      video: {
                          facingMode: { ideal: "environment" },
                          width: { ideal: 1920, min: 1280 },
                          height: { ideal: 1080, min: 720 }
                      }
                  });

                  [activeTrack] = stream.getVideoTracks();
                  await applyBestCameraConstraints(activeTrack);
                  videoElement.srcObject = stream;
                  await videoElement.play();
                  await waitForVideoReady(videoElement);

                  const settings = activeTrack && typeof activeTrack.getSettings === "function"
                      ? activeTrack.getSettings()
                      : {};

                  startLiveLoop(videoElement);

                  return {
                      mode: engineMode,
                      displayName: engineMode === "ZXING_WASM"
                          ? "ZXing-C++ WebAssembly"
                          : engineMode === "BARCODE_DETECTOR"
                              ? "Browser BarcodeDetector"
                              : "jsQR Fallback",
                      width: settings.width || videoElement.videoWidth,
                      height: settings.height || videoElement.videoHeight,
                      focusMode: settings.focusMode || "unbekannt"
                  };
              }

              function stopCamera(videoElement) {
                  stopLiveLoop();
                  liveCallback = null;
                  if (stream) {
                      for (const track of stream.getTracks()) track.stop();
                      stream = null;
                  }
                  activeTrack = null;
                  if (videoElement) videoElement.srcObject = null;
                  detector = null;
              }

              function getMode() {
                  return engineMode;
              }

              function getLastDiagnostics() {
                  if (!lastDiagnostics) return null;
                  return JSON.parse(JSON.stringify(lastDiagnostics));
              }

              function getLiveQrText() {
                  return lastLiveQrText;
              }

              global.TeiletrackingScannerService = Object.freeze({
                  startCamera,
                  stopCamera,
                  captureFrame,
                  captureBestStill,
                  detectQr,
                  getMode,
                  getLastDiagnostics,
                  getLiveQrText,
                  getErrorMessage
              });
          })(window);
          EOF

          python - <<'PY'
          from pathlib import Path

          index = Path('prototype/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('<h2 id="qrScannerTitle">QR-Code scannen</h2>', '<h2 id="qrScannerTitle">QR &amp; Label scannen</h2>', 1)
          html = html.replace('>\n                        Label aufnehmen\n                    </button>', '>\n                        Foto aufnehmen &amp; prüfen\n                    </button>', 1)
          old_hint = '''                    Fülle den markierten Rahmen möglichst vollständig mit dem Label, halte das Handy parallel zum Label und vermeide Spiegelungen.\n                    Nach dem Auslösen prüft das Tool Bildschärfe und Helligkeit, versucht den QR-Code in mehreren Bildvarianten und Teilbereichen\n                    und startet danach die OCR. Wenn ein QR-Code technisch erkannt wird, aber das Datenformat unbekannt ist, wird das jetzt getrennt angezeigt.\n                    Ist die Aufnahme nicht vollständig lesbar, erscheint „Bitte erneut scannen“. Nach dem fünften erfolglosen Versuch wird „Manuell hinzufügen“ angeboten.'''
          new_hint = '''                    Der QR-Code wird jetzt bereits live mit ZXing-C++ WebAssembly gesucht. Richte den QR-Code in den Rahmen und halte kurz still.\n                    Für die Label-OCR wird beim Auslösen – wenn das Gerät es unterstützt – ein hochauflösendes Kamera-Foto statt nur eines Videoframes verwendet.\n                    Vermeide Spiegelungen und halte das Label möglichst parallel zur Kamera. Nach fünf erfolglosen Versuchen bleibt die manuelle Erfassung verfügbar.'''
          if old_hint in html:
              html = html.replace(old_hint, new_hint, 1)
          html = html.replace(
              '    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>\n',
              '    <script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.4/dist/iife/reader/index.js"></script>\n    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>\n',
              1
          )
          index.write_text(html, encoding='utf-8')

          app = Path('prototype/app.js')
          js = app.read_text(encoding='utf-8')
          old_capture = '''        const { canvas, context } =\n            createCapturedLabelCanvas();\n\n        const dataUrl =\n            canvas.toDataURL(\n                "image/jpeg",\n                0.92\n            );'''
          new_capture = '''        const {\n            canvas,\n            context,\n            dataUrl,\n            captureSource\n        } = await TeiletrackingScannerService\n            .captureBestStill(\n                elements.qrScannerVideo\n            );'''
          if old_capture not in js:
              raise SystemExit('capture block not found')
          js = js.replace(old_capture, new_capture, 1)

          old_preview = '''        showCapturedLabelPreview(\n            dataUrl,\n            qrText\n                ? "Foto gespeichert. QR-Code erkannt. Sichtbare Beschriftung wird jetzt mit mehreren Bildvarianten per OCR gelesen."\n                : "Foto gespeichert. Kein QR-Code erkannt. Die sichtbare Beschriftung wird trotzdem per OCR gelesen."\n        );'''
          new_preview = '''        showCapturedLabelPreview(\n            dataUrl,\n            qrText\n                ? `${captureSource}: QR-Code erkannt. Sichtbare Beschriftung wird jetzt per OCR gelesen.`\n                : `${captureSource}: Kein QR-Code erkannt. Die sichtbare Beschriftung wird trotzdem per OCR gelesen.`\n        );'''
          if old_preview in js:
              js = js.replace(old_preview, new_preview, 1)

          old_start = '''            await TeiletrackingScannerService\n                .startCamera(\n                    elements.qrScannerVideo\n                );'''
          new_start = '''            await TeiletrackingScannerService\n                .startCamera(\n                    elements.qrScannerVideo,\n                    {\n                        onQrDetected: (qrText, info) => {\n                            elements.qrInput.value = qrText;\n                            setQrScanResult(\n                                "QR-Code live erkannt.",\n                                "success"\n                            );\n                            setQrScannerStatus(\n                                "QR-Code erkannt. Jetzt Foto aufnehmen, damit die sichtbare Label-Beschriftung geprüft wird.",\n                                "success"\n                            );\n                            if (elements.scannerDiagnostics) {\n                                elements.scannerDiagnostics.textContent =\n                                    `QR live erkannt · Engine: ${info.engine} · ${new Date(info.foundAt).toLocaleTimeString()}`;\n                            }\n                        }\n                    }\n                );'''
          if old_start not in js:
              raise SystemExit('startCamera block not found')
          js = js.replace(old_start, new_start, 1)
          js = js.replace(
              '`Kamera aktiv (${scanner.displayName}) · ${scanner.width}×${scanner.height} · Fokus: ${scanner.focusMode}. Richte das Label formatfüllend aus; QR-Code und Text müssen scharf sichtbar sein.`',
              '`Kamera aktiv (${scanner.displayName}) · ${scanner.width}×${scanner.height} · Fokus: ${scanner.focusMode}. QR-Code in den Rahmen halten; die Erkennung läuft automatisch.`',
              1
          )
          app.write_text(js, encoding='utf-8')

          styles = Path('prototype/styles.css')
          css = styles.read_text(encoding='utf-8')
          marker = '/* Compact scanner v2 */'
          if marker not in css:
              css += r'''

/* Compact scanner v2 */
.scanner-overlay {
    align-items: center;
    padding: 14px;
}

.scanner-dialog {
    width: min(560px, 100%);
    max-height: calc(100vh - 28px);
    overflow-y: auto;
    border-radius: 12px;
}

.scanner-header {
    align-items: center;
    padding: 12px 16px;
}

.scanner-header h2 {
    margin-bottom: 0;
    font-size: 1.05rem;
}

.scanner-header .eyebrow {
    margin-bottom: 2px;
}

.scanner-close-button {
    width: 34px;
    height: 34px;
    flex-basis: 34px;
    font-size: 1.25rem;
}

.scanner-content {
    gap: 9px;
    padding: 12px 16px 16px;
}

.scanner-video-shell {
    width: min(100%, 480px);
    max-height: 42vh;
    margin: 0 auto;
    aspect-ratio: 4 / 3;
    border-radius: 9px;
}

.scanner-target {
    inset: 13%;
    width: auto;
    height: auto;
}

.scanner-target span {
    width: 32px;
    height: 32px;
}

.scanner-status,
.scanner-diagnostics {
    padding: 8px 10px;
    font-size: 0.78rem;
}

.scanner-actions {
    gap: 7px;
}

.scanner-actions .button {
    min-height: 36px;
    padding: 0 12px;
    font-size: 0.82rem;
}

.scanner-trigger-button {
    min-width: 160px;
}

.scanner-content > .hint {
    margin-top: 2px;
    font-size: 0.76rem;
    line-height: 1.35;
}

@media (max-width: 720px) {
    .scanner-dialog {
        min-height: 0;
        max-height: calc(100vh - 16px);
        border-radius: 12px;
    }

    .scanner-header,
    .scanner-content {
        padding-left: 12px;
        padding-right: 12px;
    }

    .scanner-video-shell {
        max-height: 38vh;
        aspect-ratio: 4 / 3;
    }

    .scanner-actions {
        grid-template-columns: 1fr 1fr;
    }

    .scanner-actions .button {
        width: 100%;
    }

    .scanner-actions .scanner-trigger-button {
        grid-column: 1 / -1;
    }
}
'''
          styles.write_text(css, encoding='utf-8')
          PY

      - name: Validate scanner files
        shell: bash
        run: |
          node --check prototype/scanner-service.js
          node --check prototype/app.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('prototype/index.html').read_text(encoding='utf-8')
          if 'zxing-wasm@3.1.4' not in html:
              raise SystemExit('ZXing WASM script missing')
          if 'Foto aufnehmen &amp; prüfen' not in html:
              raise SystemExit('compact capture label missing')
          ids = re.findall(r'id="([^"]+)"', html)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if duplicates:
              raise SystemExit(f'duplicate ids: {duplicates}')
          css = Path('prototype/styles.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces unbalanced')
          print('scanner v2 validation OK')
          PY

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/apply-zxing-wasm-scanner.yml
          git config user.name "Teiletracking Automation"
          git config user.email "actions@users.noreply.github.com"
          git add prototype/index.html prototype/styles.css prototype/app.js prototype/scanner-service.js .github/workflows/apply-zxing-wasm-scanner.yml
          git commit -m "Replace QR scanner with ZXing WASM and high resolution capture"
          git push origin scanner/zxing-wasm-compact-v2
