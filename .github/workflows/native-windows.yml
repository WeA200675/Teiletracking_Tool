name: Native Windows Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-host/**'
      - 'prototype/**'
      - 'tests/data/**'
      - '.github/workflows/native-windows.yml'
  push:
    branches: [ main ]
    paths:
      - 'native-host/**'
      - 'prototype/**'
      - 'tests/data/**'
      - '.github/workflows/native-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained Windows executable
        run: dotnet publish native-host/Teiletracking.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - name: Verify distribution
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Teiletracking.exe)) { throw "Teiletracking.exe fehlt" }
          if (-not (Test-Path dist/appsettings.default.json)) { throw "appsettings.default.json fehlt" }
          if (-not (Test-Path dist/app/prototype/index.html)) { throw "Tracking-Webapp fehlt" }
      - name: Create distribution
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Teiletracking-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Teiletracking-Windows-x64
          path: Teiletracking-Windows-x64.zip
          if-no-files-found: error
