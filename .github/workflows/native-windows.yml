name: Native Windows Build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-host/**'
      - 'prototype/**'
      - 'tests/**'
      - '.github/workflows/native-windows.yml'
  push:
    branches: [ main ]
    paths:
      - 'native-host/**'
      - 'prototype/**'
      - 'tests/**'
      - '.github/workflows/native-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'
      - name: Publish self-contained Windows executable
        run: dotnet publish native-host/Teiletracking.Host.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o dist
      - name: Verify distribution
        shell: pwsh
        run: |
          if (-not (Test-Path dist/Teiletracking.exe)) { throw "Teiletracking.exe fehlt" }
          if (-not (Test-Path dist/appsettings.default.json)) { throw "appsettings.default.json fehlt" }
          if (-not (Test-Path dist/app/prototype/index.html)) { throw "Tracking-Webapp fehlt" }
          if (-not (Test-Path dist/app/prototype/vendor/jsQR-1.4.0.js)) { throw "jsQR-Vendor fehlt" }
          if (-not (Test-Path dist/app/prototype/vendor/jszip-3.10.1.min.js)) { throw "JSZip-Vendor fehlt" }
      - name: Test native host network and CSRF protections
        shell: pwsh
        run: ./tests/Test-NativeHostSecurity.ps1 -ExecutablePath dist/Teiletracking.exe
      - name: Create distribution
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Teiletracking-Windows-x64.zip
      # upload-artifact v4+ is unsupported on GHES. Select an action by server.
      - name: Upload artifact (GitHub.com)
        if: ${{ github.server_url == 'https://github.com' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Teiletracking-Windows-x64
          path: Teiletracking-Windows-x64.zip
          if-no-files-found: error
      - name: Upload artifact (GitHub Enterprise Server)
        if: ${{ github.server_url != 'https://github.com' }}
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20
        with:
          name: Teiletracking-Windows-x64
          path: Teiletracking-Windows-x64.zip
          if-no-files-found: error
