name: Apply Teiletracking feature update

on:
  push:
    branches:
      - feature/ats-y-status-scanner
    paths:
      - ".github/workflows/apply-feature-update.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ats-y-status-scanner
          fetch-depth: 0

      - name: Reassemble and verify feature payload
        shell: bash
        run: |
          cat .feature-update/part-* | tr -d '\n' | base64 -d > /tmp/feature-selected.tar.xz
          echo "53a84e7fd343daee31237e79f1f268c2f8f6f4e1311348cb893324122b8eeae1  /tmp/feature-selected.tar.xz" | sha256sum -c -

      - name: Apply selected feature files
        shell: bash
        run: |
          tar -xJf /tmp/feature-selected.tar.xz -C .
          # The payload originated from a later local provider experiment. The
          # provider test itself is deliberately not part of this feature, so
          # keep Run-AllTests aligned with the files that really belong here.
          sed -i '/Test-SharePointImportProvider\.ps1/d' tests/Run-AllTests.ps1
          rm -rf .feature-update
          rm -f .github/workflows/apply-feature-update.yml

      - name: Validate JavaScript
        shell: bash
        run: |
          for file in prototype/*.js; do
            node --check "$file"
          done

      - name: Validate JSON and HTML IDs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          from collections import Counter

          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))

          html = Path('prototype/index.html').read_text(encoding='utf-8')
          ids = re.findall(r'\bid="([^"]+)"', html)
          duplicates = [name for name, count in Counter(ids).items() if count > 1]
          if duplicates:
              raise SystemExit(f'Duplicate HTML IDs: {duplicates}')

          app = Path('prototype/app.js').read_text(encoding='utf-8')
          refs = set(re.findall(r'getElementById\("([^"]+)"\)', app))
          missing = sorted(refs - set(ids))
          if missing:
              raise SystemExit(f'Missing HTML IDs referenced by app.js: {missing}')

          print('JSON and HTML validation OK')
          PY

      - name: Validate SharePoint mapping against schemas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          mapping = json.loads(Path('prototype/sharepoint-import-map.json').read_text(encoding='utf-8'))
          schemas = {
              'Steuergeraete': json.loads(Path('powershell/lists/Steuergeraete.json').read_text(encoding='utf-8')),
              'ImportBatches': json.loads(Path('powershell/lists/ImportBatches.json').read_text(encoding='utf-8')),
              'TrackingImportArchiv': json.loads(Path('powershell/libraries/TrackingImportArchiv.json').read_text(encoding='utf-8')),
          }

          for target_name, target in mapping['Targets'].items():
              schema = schemas[target_name]
              fields = {item['InternalName'] for item in schema['Fields']}
              if target_name != 'TrackingImportArchiv':
                  fields.add('Title')
              unknown = sorted(set(target['Fields']) - fields)
              if unknown:
                  raise SystemExit(f'Unknown mapped fields for {target_name}: {unknown}')

          print('SharePoint mapping validation OK')
          PY

      - name: Run local PowerShell tests
        shell: pwsh
        run: |
          ./tests/Run-AllTests.ps1

      - name: Commit applied feature update
        shell: bash
        run: |
          git config user.name "Teiletracking Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add ATS Y-number status and scanner improvements"
          git push origin HEAD:feature/ats-y-status-scanner
