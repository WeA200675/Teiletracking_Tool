name: Validate scanner v2

on:
  push:
    branches:
      - scanner/zxing-wasm-compact-v2
    paths:
      - ".github/workflows/validate-scanner-v2.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: scanner/zxing-wasm-compact-v2
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: |
          node --check prototype/scanner-service.js
          node --check prototype/app.js

      - name: Check scanner API markers
        run: |
          grep -q "ZXING_WASM" prototype/scanner-service.js
          grep -q "captureBestStill" prototype/scanner-service.js
          grep -q "installCompactScannerUi" prototype/scanner-service.js

      - name: Remove temporary workflow
        run: |
          rm .github/workflows/validate-scanner-v2.yml
          git config user.name "Teiletracking Automation"
          git config user.email "actions@users.noreply.github.com"
          git add .github/workflows/validate-scanner-v2.yml
          git commit -m "Remove scanner validation workflow"
          git push origin scanner/zxing-wasm-compact-v2
